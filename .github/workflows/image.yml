name: Image compatibility and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.0'
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build candidate
        uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: Containerfile
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ github.event_name == 'pull_request' && 'neon-law-postgres:smoke' || format('ghcr.io/neon-law-source-code/neon-law-postgres:candidate-{0}-{1}-{2}', github.run_id, github.run_attempt, matrix.arch) }}
          sbom: ${{ github.event_name != 'pull_request' }}
          provenance: ${{ github.event_name != 'pull_request' && 'mode=max' || 'false' }}
      - name: Test exact candidate
        env:
          IMAGE: ${{ github.event_name == 'pull_request' && 'neon-law-postgres:smoke' || format('ghcr.io/neon-law-source-code/neon-law-postgres@{0}', steps.build.outputs.digest) }}
        run: |
          bash tests/run.sh "$IMAGE" | tee smoke.log
          echo "$IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.arch }}
          path: '*.log'
  publish:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote tested manifests without rebuilding
        run: |
          registry=ghcr.io/neon-law-source-code/neon-law-postgres
          tag="$registry:pg16.15-age1.6.0-vector0.8.2-${{ github.sha }}"
          docker buildx imagetools create --tag "$tag" \
            "$registry:candidate-${{ github.run_id }}-${{ github.run_attempt }}-amd64" \
            "$registry:candidate-${{ github.run_id }}-${{ github.run_attempt }}-arm64"
          docker buildx imagetools inspect "$tag" | tee release.txt
          digest=$(awk '/^Digest:/ {print $2}' release.txt)
          test -n "$digest"
          echo "$registry@$digest" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: published-digest
          path: release.txt
